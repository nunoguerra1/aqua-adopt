services:
  db:
    image: postgres:16-alpine
    container_name: aqua-adopt-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: aqua
      POSTGRES_PASSWORD: aqua
      POSTGRES_DB: aqua_adopt
    ports:
      - "5432:5432"
    volumes:
      - aqua_adopt_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aqua -d aqua_adopt"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  aqua_adopt_pgdata: